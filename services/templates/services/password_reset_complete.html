<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Successful | PolyVTU</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* Subtle background pattern */
        .bg-pattern {
            background-image: radial-gradient(circle at 1px 1px, #e2e8f0 1px, transparent 0);
            background-size: 24px 24px;
        }
        
        .success-check {
            animation: scaleIn 0.5s ease-out, pulse 2s infinite;
        }
        @keyframes scaleIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            50% { box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex items-center justify-center bg-pattern p-4">

    <div class="w-full max-w-md">
        
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-200/50 ring-4 ring-indigo-50">
                <i class="fa-solid fa-bolt text-white text-xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-slate-900 tracking-tight">PolyVTU</h1>
        </div>

        <!-- Success Card -->
        <div class="bg-white rounded-2xl shadow-lg shadow-slate-200/50 border border-slate-200/80 overflow-hidden text-center p-8">
            
            <!-- Success Icon -->
            <div class="w-20 h-20 bg-emerald-100 rounded-full flex items-center justify-center mx-auto success-check mb-6">
                <i class="fa-solid fa-check text-3xl text-emerald-600"></i>
            </div>

            <h2 class="text-xl font-bold text-slate-900 mb-2">Password Reset Successful</h2>
            <p class="text-sm text-slate-500 mb-8">
                Your password has been reset successfully. You can now log in with your new password.
            </p>

            <a href="{% url 'login' %}" 
               class="w-full inline-flex justify-center items-center gap-2.5 px-6 py-3 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold rounded-xl transition-all duration-200 shadow-sm hover:shadow-md active:scale-[0.98]">
                <i class="fa-solid fa-arrow-right-to-bracket text-sm"></i>
                Login to Your Account
            </a>

            <div class="mt-6 pt-6 border-t border-slate-100">
                <p class="text-xs text-slate-400">
                    <i class="fa-solid fa-shield-halved text-emerald-500 mr-1"></i>
                    Your account is now secure with your new password
                </p>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-8">
            <p class="text-[11px] text-slate-400">© {% now "Y" %} PolyVTU. All rights reserved.</p>
        </div>

    </div>

</body>
</html>
